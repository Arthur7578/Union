project_id = "jriyeblycrzpozjuexvr"

# CAPTCHA protection (Cloudflare Turnstile) is switched on for the hosted project
# in the dashboard — Authentication → Bot and Abuse Protection — so it is
# deliberately not enabled here: local development and the CI database job don't
# need it. See "Bot protection on sign-up" in the README.

# The sign-in code has 8 digits, as on the hosted project (the sign-in form
# only accepts 8). The local default is 6, which the form would refuse.
[auth.email]
otp_length = 8

# The browser tests sign in through the form (e2e/sign-in.spec.ts), and each
# run sends a few codes; the local default allows 2 emails an hour.
[auth.rate_limit]
email_sent = 100

# Regular passwordless sign-in sends a numeric code. Existing users who are
# invited as co-organisers also go through Supabase's magic-link template
# (the dedicated invite template only creates new Auth users). Those calls
# include RedirectTo, so the template renders invitation copy and a button.
#
# This block configures local development. For the hosted project, mirror
# the same subject + template in the Supabase dashboard under
# Authentication → Email Templates → Magic Link (or via the Management API
# `mailer_subjects_magic_link` / `mailer_templates_magic_link_content`).
[auth.email.template.magic_link]
subject = "{{ if .RedirectTo }}You've been invited to plan a wedding in Union{{ else }}{{ .Token }} is your Union sign-in code{{ end }}"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You've been invited to plan a wedding in Union"
content_path = "./supabase/templates/invite.html"
