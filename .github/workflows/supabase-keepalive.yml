name: Supabase keepalive

# Supabase pauses Free plan projects that see too few database requests over
# 7 days (https://supabase.com/docs/guides/platform/free-project-pausing).
# Visiting the website is not enough, since cached pages never reach the
# database.
#
# History: from 2026-11-03 this job made ONE read a day (an empty list because
# of RLS), every one answered 200, and Supabase still paused the project on
# 2026-11-23. One empty read was not enough activity. So each run now makes
# several real writes through public.keepalive_ping()
# (migration 20261123120000_keepalive_ping.sql), spread over about a minute.
#
# The job used to read /rest/v1/weddings too. Since migration
# 20261125120000_anon_least_privilege.sql the publishable key (role anon)
# has no privilege on any table, so that read would be refused every day.
# keepalive_ping() is the job's only way in, granted to anon on purpose.
#
# If any request does not get a 2xx (project paused, URL or key wrong,
# migration not applied), the run fails and GitHub emails about it.
#
# Needs two repository secrets, the same values as the web app's
# NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
#   SUPABASE_URL              e.g. https://<ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_... (public key, never the secret one)

on:
  schedule:
    # Every day: Supabase asks for "a few user requests to the database each
    # day over the previous week". GitHub often starts scheduled runs hours
    # late (this one used to start around 13:00 instead of 04:23) and can skip
    # one, so a daily run keeps a margin.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write through the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing secret SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          base="${SUPABASE_URL%/}/rest/v1"
          failed=0

          # request <label> <curl args...>: one call, logged, counted as failed if not 2xx.
          request() {
            label="$1"; shift
            status=$(curl -sS -o /tmp/body -w "%{http_code}" \
              --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$@") || status=000
            echo "$label: HTTP $status $(head -c 200 /tmp/body 2>/dev/null)"
            case "$status" in
              2??) ;;
              *) failed=1 ;;
            esac
          }

          for round in 1 2 3; do
            request "write #$round" -X POST \
              -H "Content-Type: application/json" -d '{}' \
              "$base/rpc/keepalive_ping"
            if [ "$round" -lt 3 ]; then sleep 20; fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one Supabase request failed. Is the project paused (https://supabase.com/dashboard/projects)? Is migration 20261123120000_keepalive_ping applied?"
            exit 1
          fi
