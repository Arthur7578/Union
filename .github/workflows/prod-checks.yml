name: Production checks

# Read-only checks of the live site and the hosted Supabase project
# (apps/web/e2e-prod, config apps/web/playwright.prod.config.ts). They catch
# what CI's local database cannot: a privilege or setting that differs in
# production, a missing Vercel variable, a captcha key that no longer matches
# its secret, a broken guest RPC, a paused project.
#
#   public.spec.ts     signed-out visitors (role anon): no table, guest RPCs work
#   captcha.spec.ts    the sign-in captcha's chain: site key → Cloudflare widget
#                      → widget secret → the secret Supabase Auth checks with
#   guest.spec.ts      a guest's link and the group link, on a phone, through
#                      the envelope animation
#   organiser.spec.ts  every organiser page, signed in as PROD_CHECK_EMAIL
#
# Signing in: a bot cannot pass the Turnstile captcha. The organiser checks ask
# Supabase for a one-time sign-in code with the secret key (admin
# generateLink, no email sent) and confirm it with the publishable key
# (/auth/v1/verify has no captcha). The secret key never reaches the browser.
#
# When: every day, after each run of "Apply branch migrations", and by hand.
# A failure emails the repository's watchers, like the keepalive job.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY   already there for the keepalive job
#   PROD_CHECK_GUEST_TOKEN   a guest's link token (/guest/<token>) on the wedding the checks use
#   PROD_CHECK_JOIN_CODE     that wedding's group link code (/join/<code>)
#   PROD_CHECK_EMAIL         the organiser account the signed-in checks use
#   SUPABASE_SECRET_KEY      Supabase → Project Settings → API Keys → secret key
#   SUPABASE_ACCESS_TOKEN    Supabase → Account → Access Tokens (reads the auth settings)
#   CLOUDFLARE_API_TOKEN     Cloudflare → My Profile → API Tokens, permission "Turnstile: Read"
#   CLOUDFLARE_ACCOUNT_ID    Cloudflare → the account's ID (dashboard sidebar)
# A missing secret fails the check that needs it, naming the secret.
#
# Once real couples use Union, point PROD_CHECK_* at a wedding kept for these
# checks, so they never look at a real one.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_run:
    workflows: ["Apply branch migrations"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-checks
  cancel-in-progress: false

jobs:
  check:
    # Only main's checks run with the production secrets.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - run: npm run e2e:prod --workspace apps/web
        env:
          CI: "true"
          PROD_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PROD_CHECK_GUEST_TOKEN: ${{ secrets.PROD_CHECK_GUEST_TOKEN }}
          PROD_CHECK_JOIN_CODE: ${{ secrets.PROD_CHECK_JOIN_CODE }}
          PROD_CHECK_EMAIL: ${{ secrets.PROD_CHECK_EMAIL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-prod
          path: |
            apps/web/playwright-report-prod/
            apps/web/test-results/
          retention-days: 7
